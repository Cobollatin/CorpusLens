<main class="shell">
  <header><p class="eyebrow">CorpusLens · Phase 1</p><h1>Explore the corpus</h1><p>Multilingual search is being prepared. Search indexing will be available in a later phase.</p></header>
  <form (submit)="$event.preventDefault()">
    <label for="query">Search text</label>
    <div class="search"><input id="query" type="search" placeholder="Enter a word, phrase, or question" disabled><button type="submit" disabled>Search</button></div>
  </form>
  <p class="notice">No corpus has been indexed yet.</p>
</main>
