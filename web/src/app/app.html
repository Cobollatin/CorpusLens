<main class="shell">
  <header class="masthead">
    <a class="brand" href="/en">CorpusLens</a>
    <nav class="languages" aria-label="Language"><a href="/en" [attr.aria-current]="language === 'E' ? 'page' : null">EN</a><span>|</span><a href="/es" [attr.aria-current]="language === 'S' ? 'page' : null">ES</a></nav>
  </header>
  <form class="search-panel" (ngSubmit)="search()">
    <label class="visually-hidden" for="query">{{ t.label }}</label>
    <div class="search-row"><input id="query" name="query" [(ngModel)]="query" type="search" [placeholder]="t.placeholder" maxlength="500"><button type="submit" [disabled]="loading || !query.trim()">{{ loading ? t.searching : t.search }}</button></div>
  </form>
  <p class="error" *ngIf="error">{{ error }}</p>
  <section class="results" *ngIf="response" aria-live="polite">
    <p class="result-count">{{ response.results.length }} {{ response.results.length === 1 ? t.oneResult : t.results }}</p>
    <p class="empty" *ngIf="!response.results.length">{{ t.empty }}</p>
    <article class="card" *ngFor="let result of response.results">
      <h2>{{ result.reference }}</h2>
      <p class="section" *ngIf="result.section">{{ result.section }}</p>
      <div class="verse" *ngFor="let verse of result.verses" [class.primary]="verse.isPrimaryHighlight">
        <span class="number">{{ verse.number }}</span><p>{{ verse.text }}</p>
        <div class="links"><a *ngIf="verse.jwLink" [href]="verse.jwLink" target="_blank" rel="noopener noreferrer">JW.org ↗</a><a *ngIf="verse.wolLink" [href]="verse.wolLink" target="_blank" rel="noopener noreferrer">WOL ↗</a></div>
      </div>
    </article>
  </section>
</main>
