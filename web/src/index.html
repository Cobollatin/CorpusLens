<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CorpusLens</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <script src="config.js"></script>
  <script>try { const saved = localStorage.getItem('corpuslens-theme'); document.documentElement.dataset.theme = saved === 'dark' || saved !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; } catch { document.documentElement.dataset.theme = 'light'; }</script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
